<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ccdeck</title>
<link rel="icon" id="favicon" href="data:,">
<style>
:root {
  --bg: #f6f6f4; --panel: #ffffff; --text: #1c1c1a; --muted: #6b6a66; --line: #e3e2de;
  --chip: #efeeea; --focus: #2f6feb; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 1px 1px rgba(0,0,0,.03);
  --st-permission: #d93036; --st-question: #e2620c; --st-plan: #c97a00; --st-decision: #c2298a;
  --st-error: #9f1d24; --st-ci_failing: #d93036; --st-changes_requested: #c4410c;
  --st-pr_conflict: #a35d00; --st-pr_review: #7c4dcc; --st-working: #c98a00; --st-ci_pending: #1f6fd1;
  --st-parked: #6f7480; --st-idle: #23864a; --st-quiet: #8a7f6d; --st-closed_midtask: #8d6a46;
  --st-closed: #85857f; --st-pr_merged: #6e4fc4; --st-done: #4f8a5e;
  --g-needs: #d93036; --g-review: #7c4dcc; --g-working: #c98a00; --g-waiting: #1f6fd1;
  --g-yours: #23864a; --g-closed: #85857f; --g-done: #4f8a5e;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --panel: #1d1d1b; --text: #ecebe6; --muted: #9c9a93; --line: #2f2e2b;
    --chip: #2a2926; --focus: #6aa0ff; --shadow: none;
    --st-permission: #ff6b6f; --st-question: #ff9547; --st-plan: #f2b134; --st-decision: #ef6fbf;
    --st-error: #ff5a62; --st-ci_failing: #ff6b6f; --st-changes_requested: #ff8a4c;
    --st-pr_conflict: #e0a040; --st-pr_review: #b294ff; --st-working: #f2c14e; --st-ci_pending: #5ea7ff;
    --st-parked: #9aa0ab; --st-idle: #4cc47b; --st-quiet: #b8ab95; --st-closed_midtask: #c49a72;
    --st-closed: #8f8e88; --st-pr_merged: #a58cf5; --st-done: #6fbf86;
    --g-needs: #ff6b6f; --g-review: #b294ff; --g-working: #f2c14e; --g-waiting: #5ea7ff;
    --g-yours: #4cc47b; --g-closed: #8f8e88; --g-done: #6fbf86;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --panel: #1d1d1b; --text: #ecebe6; --muted: #9c9a93; --line: #2f2e2b;
  --chip: #2a2926; --focus: #6aa0ff; --shadow: none;
  --st-permission: #ff6b6f; --st-question: #ff9547; --st-plan: #f2b134; --st-decision: #ef6fbf;
  --st-error: #ff5a62; --st-ci_failing: #ff6b6f; --st-changes_requested: #ff8a4c;
  --st-pr_conflict: #e0a040; --st-pr_review: #b294ff; --st-working: #f2c14e; --st-ci_pending: #5ea7ff;
  --st-parked: #9aa0ab; --st-idle: #4cc47b; --st-quiet: #b8ab95; --st-closed_midtask: #c49a72;
  --st-closed: #8f8e88; --st-pr_merged: #a58cf5; --st-done: #6fbf86;
  --g-needs: #ff6b6f; --g-review: #b294ff; --g-working: #f2c14e; --g-waiting: #5ea7ff;
  --g-yours: #4cc47b; --g-closed: #8f8e88; --g-done: #6fbf86;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Ubuntu, Cantarell, sans-serif;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

header {
  position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
.bar { max-width: 1500px; margin: 0 auto; padding: 12px 20px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.sub { font-weight: 400; color: var(--muted); font-size: 13px; }
h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--g-yours); }
.pulse.off { background: var(--st-permission); }
.updated { color: var(--muted); font-size: 12px; }
.spacer { flex: 1; }
.search { min-width: 220px; flex: 0 1 300px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; user-select: none; }
.summary { max-width: 1500px; margin: 0 auto; padding: 0 20px 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.sum {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--chip); border: 1px solid transparent; cursor: pointer; font-size: 13px;
}
.sum b { font-variant-numeric: tabular-nums; }
.sum .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gc); }
.sum.zero { opacity: .45; }
.sum.active { border-color: var(--gc); }

main { max-width: 1500px; margin: 0 auto; padding: 8px 20px 60px; }
.banner { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; background: var(--chip); color: var(--muted); font-size: 13px; }
.banner code { background: var(--panel); padding: 1px 5px; border-radius: 4px; }
.banner.err { color: var(--st-permission); }
section { margin-top: 22px; }
section > h2 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted);
  margin: 0 0 10px; display: flex; align-items: center; gap: 8px; font-weight: 650;
}
section > h2 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gc); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 12px; }

.card {
  background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c);
  border-radius: 10px; padding: 12px 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 7px; min-width: 0;
}
.card.dim { opacity: .72; }
.top { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 12px;
  color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent);
}
.pill .d { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.pill.anim .d { animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.anim .d { animation: none; } }
.live { display: inline-flex; align-items: center; gap: 4px; }
.live i { width: 6px; height: 6px; border-radius: 50%; background: var(--g-yours); display: inline-block; }
.live.no i { background: transparent; border: 1px solid var(--muted); }
.age { margin-left: auto; white-space: nowrap; }
.title { font-size: 15px; font-weight: 620; margin: 0; overflow-wrap: anywhere; }
.meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.meta span { overflow-wrap: anywhere; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
.note { font-size: 13px; padding: 4px 8px; border-radius: 6px; background: var(--chip); }
.msg {
  font-size: 13px; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; cursor: pointer;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  border-radius: 6px; padding: 6px 8px; background: color-mix(in srgb, var(--chip) 60%, transparent);
}
.msg.open { display: block; max-height: 420px; overflow: auto; }
.msg .who { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; display: block; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 6px; background: var(--chip);
  font-size: 12px; text-decoration: none; border: 1px solid transparent; max-width: 100%;
}
.chip:hover { border-color: var(--line); }
.chip.pr { border-color: color-mix(in srgb, var(--pc) 45%, transparent); }
.chip.pr .s { color: var(--pc); font-weight: 600; }
.files { font-size: 12px; color: var(--muted); }
.files summary { cursor: pointer; }
.files ul { margin: 4px 0 0; padding-left: 16px; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
.btn {
  padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-size: 12.5px;
}
.btn:hover { background: var(--chip); }
.btn.primary { background: var(--text); color: var(--panel); border-color: var(--text); }
.btn.primary:hover { opacity: .88; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--panel);
  padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; }
.legend { margin-top: 40px; font-size: 12px; color: var(--muted); }
.legend summary { cursor: pointer; }
.legend .grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 6px 16px; margin-top: 10px; }
@media (max-width: 600px) {
  .bar, .summary, main { padding-left: 16px; padding-right: 16px; }
  .search { flex: 1 1 100%; min-width: 0; order: 5; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><span class="pulse" id="pulse"></span>ccdeck <span class="sub">Claude Code sessions</span></h1>
    <span class="updated" id="updated"></span>
    <span class="spacer"></span>
    <input class="search" id="q" type="search" placeholder="Filter by title, project, branch, note…" autocomplete="off">
    <label class="toggle"><input type="checkbox" id="old"> older closed</label>
    <label class="toggle"><input type="checkbox" id="done"> done</label>
  </div>
  <div class="summary" id="summary"></div>
</header>
<main>
  <div id="banners"></div>
  <div id="board"></div>
  <details class="legend" id="legend"><summary>What the states mean</summary><div class="grid" id="legendGrid"></div></details>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const TOKEN = "__CC_TOKEN__";
const STATE_HELP = {
  permission: "A tool call is waiting for your approval.",
  question: "Claude asked you a question (multiple choice).",
  plan: "Claude wrote a plan and waits for you to approve it.",
  decision: "Claude's last message ends with a question or asks you to choose.",
  error: "The last turn ended with an API error.",
  ci_failing: "A PR from this session has failing checks.",
  changes_requested: "A reviewer requested changes on a PR from this session.",
  pr_conflict: "A PR from this session has merge conflicts.",
  pr_review: "A PR from this session is open with green or no checks: review or merge it.",
  working: "Claude is running right now.",
  ci_pending: "Checks are running on a PR from this session.",
  parked: "You set this session aside.",
  idle: "Claude finished; the session is open and waits for your next prompt.",
  quiet: "Last seen working, but nothing happened for 15 minutes (interrupted?).",
  closed_midtask: "The session was closed while Claude was still working.",
  closed: "The session isn't running and isn't marked done.",
  pr_merged: "All PRs from this session are merged.",
  done: "You marked it done.",
};
const ANIM = new Set(["working", "ci_pending"]);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

let data = null, etag = "", lastOk = 0, focusGroup = null;
const expanded = new Set(), openFiles = new Set();
const shq = (v) => "'" + String(v).replace(/'/g, "'\\''") + "'";
const $ = (id) => document.getElementById(id);
$("done").checked = ls.get("showDone", false);
$("old").checked = ls.get("showOld", false);

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid instanceof Node ? kid : String(kid));
  return el;
}
function ago(ts) {
  if (!ts) return "?";
  const d = Date.now() / 1000 - ts;
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + "m ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  return Math.floor(d / 86400) + "d ago";
}
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}
function safeUrl(u) { return /^https:\/\//.test(u) ? u : null; }

async function load() {
  try {
    const r = await fetch("/api/sessions", { headers: { "X-CC-Token": TOKEN, "If-None-Match": etag }, cache: "no-store" });
    lastOk = Date.now();
    if (r.status === 304) { renderStatus(); return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    etag = r.headers.get("ETag") || "";
    data = await r.json();
    render();
  } catch (e) {
    renderStatus(String(e));
  }
}

async function act(id, action, extra) {
  try {
    const r = await fetch("/api/action", {
      method: "POST", headers: { "X-CC-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ id, action }, extra || {})),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    const msgs = { resume: "Opening terminal" + (j.terminal ? " (" + j.terminal + ")" : "") + "…",
      done: "Marked done", undone: "Reopened", park: "Parked", unpark: "Unparked", note: "Note saved",
      open_folder: "Opening folder…", refresh_prs: "PR status refreshed" };
    toast(msgs[action] || "OK");
    etag = ""; load();
  } catch (e) { toast("Failed: " + e.message); }
}

function renderStatus(err) {
  const stale = !lastOk || Date.now() - lastOk > 8000;
  $("pulse").classList.toggle("off", !!err || stale);
  $("updated").textContent = err ? "Can't reach the ccdeck server" : data ? "updated " + ago(data.generated) : "";
}

function setFavicon(n, color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="${color}"/>` +
    (n ? `<text x="16" y="21.5" font-size="15" font-family="sans-serif" font-weight="700" fill="#fff" text-anchor="middle">${n > 9 ? "9+" : n}</text>` : "") + "</svg>";
  $("favicon").href = "data:image/svg+xml," + encodeURIComponent(svg);
}

function matches(s, q) {
  if (!q) return true;
  const hay = [s.display_title, s.project, s.cwd_short, s.branch, s.mark && s.mark.note, s.id, s.label].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}

function visible() {
  const q = $("q").value.trim(), showDone = $("done").checked, showOld = $("old").checked;
  const cutoff = Date.now() / 1000 - (data.default_days || 14) * 86400;
  return data.sessions.filter((s) => {
    if (!matches(s, q)) return false;
    if (s.group === "done" && !showDone) return false;
    if (s.group === "closed" && s.last_ts < cutoff && !showOld) return false;
    return true;
  });
}

function prChip(p) {
  let label = p.number ? "#" + p.number : "PR", st = "", col = "--st-closed";
  if (p.state === "merged") { st = "merged"; col = "--st-pr_merged"; }
  else if (p.state === "closed") { st = "closed"; }
  else if (p.state === "open") {
    if (p.checks === "failing") { st = "CI failing"; col = "--st-ci_failing"; }
    else if (p.review === "changes_requested") { st = "changes requested"; col = "--st-changes_requested"; }
    else if (p.mergeable === "conflicting") { st = "conflicts"; col = "--st-pr_conflict"; }
    else if (p.checks === "pending") { st = "CI running"; col = "--st-ci_pending"; }
    else if (p.review === "approved") { st = "approved"; col = "--st-idle"; }
    else { st = p.draft ? "draft · ready" : "ready"; col = "--st-pr_review"; }
  } else if (p.error) { st = "?"; }
  const repo = p.repo ? p.repo.split("/")[1] : "";
  return h("a", { class: "chip pr", href: safeUrl(p.url), target: "_blank", rel: "noopener noreferrer",
      title: (p.title || p.url) + (p.error ? "\n(" + p.error + ")" : ""), style: `--pc: var(${col})` },
    "PR ", h("b", {}, label), repo ? h("span", { class: "mono" }, repo) : null, st ? h("span", { class: "s" }, st) : null);
}

const LINK_NAMES = { artifact: "Artifact", notion: "Notion", linear: "Linear", figma: "Figma", gdoc: "Google Doc" };
function linkChip(kind, url) {
  let label = LINK_NAMES[kind] || kind;
  const m = kind === "linear" && url.match(/issue\/([A-Z]+-\d+)/);
  if (m) label = m[1];
  return h("a", { class: "chip", href: safeUrl(url), target: "_blank", rel: "noopener noreferrer", title: url }, label);
}

function card(s) {
  const c = `var(--st-${s.state})`;
  const m = s.mark || {};
  const isOpen = expanded.has(s.id);
  const text = s.hook_message || (s.last_role === "assistant" ? s.last_text : s.last_prompt);
  const who = s.hook_message ? "Claude Code" : s.last_role === "assistant" ? "Claude" : "You";
  const links = [];
  for (const p of s.pr_details || []) links.push(prChip(p));
  for (const [kind, urls] of Object.entries(s.links || {})) for (const u of urls) links.push(linkChip(kind, u));
  const files = s.files || [];
  const cmd = `cd ${s.cwd ? shq(s.cwd) : "~"} && claude --resume ${s.id}`;

  return h("article", { class: "card" + (s.group === "done" || s.group === "closed" ? " dim" : ""), style: `--c: ${c}` },
    h("div", { class: "top" },
      h("span", { class: "pill" + (ANIM.has(s.state) ? " anim" : ""), title: STATE_HELP[s.state] || "" }, h("span", { class: "d" }), s.label),
      h("span", { class: "live" + (s.alive ? "" : " no"), title: s.live_source === "guess" ? "Guessed from running processes (install hooks for exact state)" : "" },
        h("i"), s.alive ? "running" : "not running"),
      h("span", { class: "age", title: new Date(s.last_ts * 1000).toLocaleString() }, ago(s.last_ts))),
    h("h3", { class: "title" }, s.display_title),
    h("div", { class: "meta" },
      h("span", { title: s.cwd || "" }, s.cwd_short),
      s.branch ? h("span", { class: "mono" }, "⎇ " + s.branch) : null,
      h("span", {}, s.prompts + (s.prompts === 1 ? " prompt" : " prompts")),
      h("span", { class: "mono", title: s.id }, s.id.slice(0, 8))),
    m.note ? h("div", { class: "note" }, "📝 " + m.note) : null,
    text ? h("div", { class: "msg" + (isOpen ? " open" : ""), title: isOpen ? "Click to collapse" : "Click to expand",
      onclick: () => { isOpen ? expanded.delete(s.id) : expanded.add(s.id); render(); } },
      h("span", { class: "who" }, who), isOpen ? text.trim() : text.trim().slice(-600)) : null,
    links.length ? h("div", { class: "links" }, links) : null,
    files.length ? h("details", { class: "files", open: openFiles.has(s.id),
      ontoggle: (e) => { e.target.open ? openFiles.add(s.id) : openFiles.delete(s.id); } }, h("summary", {}, files.length + (files.length === 1 ? " file" : " files") + " written"),
      h("ul", {}, files.slice(-30).map((f) => h("li", { class: "mono" }, f)))) : null,
    h("div", { class: "actions" },
      h("button", { class: "btn primary", onclick: () => act(s.id, "resume"), title: "Open a terminal and resume this session" }, "Resume ▸"),
      h("button", { class: "btn", title: cmd, onclick: async () => {
        try { await navigator.clipboard.writeText(cmd); toast("Resume command copied"); } catch { toast(cmd); } } }, "Copy cmd"),
      h("button", { class: "btn", onclick: () => act(s.id, "open_folder") }, "Folder"),
      (s.pr_details || []).length ? h("button", { class: "btn", onclick: () => act(s.id, "refresh_prs") }, "↻ PRs") : null,
      m.parked ? h("button", { class: "btn", onclick: () => act(s.id, "unpark") }, "Unpark")
               : s.group !== "done" ? h("button", { class: "btn", onclick: () => act(s.id, "park") }, "Park") : null,
      h("button", { class: "btn", onclick: () => {
        const v = prompt("Note for this session (empty to clear):", m.note || "");
        if (v !== null) act(s.id, "note", { text: v });
      } }, "Note"),
      m.done ? h("button", { class: "btn", onclick: () => act(s.id, "undone") }, "Reopen")
             : h("button", { class: "btn", onclick: () => act(s.id, "done") }, "Done ✓")));
}

function render() {
  if (!data) return;
  renderStatus();
  const rows = visible();
  const byGroup = {};
  for (const s of rows) (byGroup[s.group] = byGroup[s.group] || []).push(s);

  const urgent = (data.counts.needs || 0) + (data.counts.review || 0);
  document.title = (urgent ? `(${urgent}) ` : "") + "ccdeck";
  const favColor = data.counts.needs ? "#d93036" : data.counts.review ? "#7c4dcc" : data.counts.working ? "#c98a00" : "#23864a";
  setFavicon(urgent, favColor);

  $("summary").replaceChildren(...data.groups.map((g) => {
    const hiddenDone = g.key === "done" && !$("done").checked;
    const n = hiddenDone ? (data.counts.done || 0) : (byGroup[g.key] || []).length;
    return h("button", { class: "sum" + (n && !hiddenDone ? "" : " zero") + (focusGroup === g.key ? " active" : ""), style: `--gc: var(--g-${g.key})`,
      title: hiddenDone ? "Show done sessions" : "Show only this group",
      onclick: () => { if (hiddenDone) { $("done").checked = true; ls.set("showDone", true); }
        focusGroup = focusGroup === g.key ? null : g.key; render();
        const el = document.getElementById("g-" + g.key); if (el && focusGroup) el.scrollIntoView({ behavior: "smooth", block: "start" }); } },
      h("span", { class: "dot" }), g.label, h("b", {}, n));
  }));

  const banners = [];
  if (!data.hooks) banners.push(h("div", { class: "banner" }, "Live states are guessed. Run ", h("code", {}, "ccdeck install"), " to add the hooks that report exact states."));
  if (!data.gh) banners.push(h("div", { class: "banner" }, "PR states need the GitHub CLI: ", h("code", {}, "sudo apt install gh"), " then ", h("code", {}, "gh auth login"), "."));
  $("banners").replaceChildren(...banners);

  const sections = data.groups.filter((g) => byGroup[g.key] && (!focusGroup || focusGroup === g.key)).map((g) =>
    h("section", { id: "g-" + g.key, style: `--gc: var(--g-${g.key})` },
      h("h2", {}, h("span", { class: "dot" }), g.label, h("span", {}, "· " + byGroup[g.key].length)),
      h("div", { class: "grid" }, byGroup[g.key].map(card))));
  $("board").replaceChildren(...(sections.length ? sections : [h("div", { class: "empty" },
    data.sessions.length ? "Nothing matches. Try the toggles above." : "No Claude Code sessions found in ~/.claude/projects yet.")]));

  if (!$("legendGrid").childElementCount) {
    $("legendGrid").replaceChildren(...Object.entries(data.states).map(([k, v]) =>
      h("div", { style: `--c: var(--st-${k})` }, h("span", { class: "pill" }, h("span", { class: "d" }), v.label), " ", STATE_HELP[k] || "")));
  }
}

$("q").addEventListener("input", render);
$("done").addEventListener("change", (e) => { ls.set("showDone", e.target.checked); render(); });
$("old").addEventListener("change", (e) => { ls.set("showOld", e.target.checked); render(); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== $("q")) { e.preventDefault(); $("q").focus(); }
  if (e.key === "Escape") { $("q").value = ""; focusGroup = null; render(); }
});

load();
setInterval(load, 2000);
setInterval(() => { if (data) render(); }, 30000);
</script>
</body>
</html>
