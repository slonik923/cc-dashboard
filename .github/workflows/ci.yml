name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.9", "3.11", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile ccdeck
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  plugin:
    name: Plugin manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: JSON files parse
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok  $f"
          done
      - name: Versions match
        run: |
          plugin=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          script=$(python3 ccdeck --version)
          echo "plugin.json $plugin, ccdeck $script"
          test "$plugin" = "$script"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: claude plugin validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
